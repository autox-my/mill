name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go checks, race tests, and cross-compile
        id: check
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          status=0
          {
            if [ -z "$(gofmt -l .)" ]; then echo "PASS gofmt"; else echo "FAIL gofmt"; status=1; fi
            if go vet ./...; then echo "PASS go vet"; else echo "FAIL go vet"; status=1; fi
            if go test -race -cover -count=1 ./...; then echo "PASS tests"; else echo "FAIL tests"; status=1; fi
            if CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/mill ./cmd/mill; then echo "PASS build"; else echo "FAIL build"; status=1; fi
            [ "$status" -eq 0 ] && echo "verdict: GREEN" || echo "verdict: RED"
          } | tee build/ci-check.out
          exit "$status"

      # Check whether Tailscale + mill ingest secrets are configured (secrets.* is disallowed in step if:).
      - name: Check advisory mill ingest config
        id: mill_env
        if: always()
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          MILL_URL: ${{ secrets.MILL_URL }}
          MILL_API_TOKEN: ${{ secrets.MILL_API_TOKEN }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ] && [ -n "$MILL_URL" ] && [ -n "$MILL_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Optional advisory telemetry ingest into self-hosted mill over Tailscale.
      # Skipped automatically on forks or when Tailscale/mill secrets are unset.
      - name: Connect Tailscale (ephemeral CI node)
        if: always() && steps.mill_env.outputs.enabled == 'true'
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Advisory ingest to mill
        if: always() && steps.mill_env.outputs.enabled == 'true'
        continue-on-error: true
        env:
          MILL_URL: ${{ secrets.MILL_URL }}
          MILL_API_TOKEN: ${{ secrets.MILL_API_TOKEN }}
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ -x ./build/mill ] && [ -f build/ci-check.out ]; then
            ./build/mill ingest \
              --source check \
              --branch "$BRANCH" \
              --harness github-actions \
              --phase ci \
              --file build/ci-check.out || true
          fi
